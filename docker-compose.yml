services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ironclaw:ironclaw@postgres:5432/ironclaw
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      IRONCLAW_SERVICE_URL: http://app:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
      - openclaw_default
    restart: unless-stopped

  eta-worker:
    build: .
    command: ["node", "dist/schedulers/EtaExpiryWorker.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ironclaw:ironclaw@postgres:5432/ironclaw
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  idle-reminder:
    build: .
    command: ["node", "dist/schedulers/IdleReminderWorker.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ironclaw:ironclaw@postgres:5432/ironclaw
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ironclaw
      POSTGRES_PASSWORD: ironclaw
      POSTGRES_DB: ironclaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironclaw"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
  openclaw_default:
    external: true
